<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Portal Login — JC TECH ZONE</title>
  <meta name="description" content="JC Tech Zone authorized staff login for administrators and bench technicians." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <style>
    .login-container {
      max-width: 440px;
      margin: 4rem auto;
      padding: 0 1rem;
    }
    .demo-pill {
      font-size: 0.72rem;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .demo-pill:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-jc">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/customer">
      <img src="assets/logo.jpg" alt="JC Tech Zone" width="34" height="34" class="rounded-circle" style="object-fit:cover;border:1px solid var(--border);" />
      <span>JC TECH <span style="color:var(--accent);">ZONE</span></span>
      <span class="ms-2 d-none d-md-inline-flex align-items-center gap-1 px-2 py-0 rounded"
            style="background:var(--primary-dim);border:1px solid var(--primary-mid);font-family:var(--font-mono);font-size:.65rem;color:var(--primary);">
        <span class="status-dot"></span> STAFF GATEWAY
      </span>
    </a>
    <div class="d-flex gap-2">
      <a href="/customer" class="btn-outline-jc btn-sm-jc">
        <i class="bi bi-arrow-left me-1"></i>Back to Customer Portal
      </a>
    </div>
  </div>
</nav>

<main class="container flex-grow-1">
  <div class="login-container">
    <div class="card-jc p-4 p-sm-5 shadow-lg">
      <div class="text-center mb-4">
        <img src="assets/logo.jpg" alt="JC Tech Zone" width="68" height="68" class="rounded-circle mb-3" style="border:2px solid var(--primary);object-fit:cover;" />
        <h1 style="font-family:var(--font-display);font-size:1.4rem;font-weight:700;margin-bottom:0.25rem;">
          Staff Portal Login
        </h1>
        <p style="color:var(--text-muted);font-size:0.8rem;margin-bottom:0;">
          Authorized access for JC Tech Zone technicians &amp; management.
        </p>
      </div>

      <div id="loginError" class="alert-jc danger mb-3 d-none">
        <i class="bi bi-exclamation-triangle me-2"></i><span id="loginErrorMsg">Invalid credentials</span>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label-jc">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text" style="background:#0e1621;border-color:var(--border);color:var(--text-muted);">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" id="username" class="form-control-jc" placeholder="admin or technician email" required autofocus />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label-jc">Password</label>
          <div class="input-group">
            <span class="input-group-text" style="background:#0e1621;border-color:var(--border);color:var(--text-muted);">
              <i class="bi bi-key"></i>
            </span>
            <input type="password" id="password" class="form-control-jc" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn-primary-jc w-100 py-2 justify-content-center" id="loginBtn">
          <span id="loginSpinner" class="spinner-jc me-2 d-none" style="width:14px;height:14px;border-width:2px;"></span>
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>

      <!-- Quick Fill Buttons for Capstone Defense -->
      <div class="mt-4 pt-3 border-top border-jc">
        <p class="font-mono mb-2" style="font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">
          Capstone Demo Quick Fill:
        </p>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="demo-pill" onclick="quickFill('admin', 'admin123')">
            👑 Admin Demo
          </button>
          <button type="button" class="demo-pill" onclick="quickFill('tech', 'tech123')">
            🔧 Tech Demo
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer-jc py-3 mt-auto">
  <div class="container text-center">
    <span style="font-size:0.75rem;color:var(--text-muted);">
      © 2026 JC TECH ZONE · Marikina City · Restricted Staff Area
    </span>
  </div>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="api.js"></script>
<script>
function quickFill(user, pass) {
  $('#username').val(user);
  $('#password').val(pass);
  $('#loginForm').submit();
}

$(document).ready(function() {
  const urlParams = new URLSearchParams(window.location.search);
  const msg = urlParams.get('msg');

  if (msg === 'admin_required') {
    $('#loginErrorMsg').text('Administrator credentials required to access the Admin Dashboard.');
    $('#loginError').removeClass('d-none');
    $('#username').val('admin');
    $('#password').val('admin123');
  } else {
    // If already authenticated, redirect to appropriate portal
    const user = API.getUser();
    if (user && API.getToken()) {
      if (user.role === 'admin') {
        window.location.href = '/admin';
        return;
      } else if (user.role === 'technician') {
        window.location.href = '/tech';
        return;
      }
    }
  }

  $('#loginForm').on('submit', function(e) {
    e.preventDefault();
    const userVal = $('#username').val().trim();
    const passVal = $('#password').val().trim();

    if (!userVal || !passVal) return;

    const $btn = $('#loginBtn');
    const $spinner = $('#loginSpinner');
    const $err = $('#loginError');

    $err.addClass('d-none');
    $btn.prop('disabled', true);
    $spinner.removeClass('d-none');

    API.login(userVal, passVal)
      .then(res => {
        if (res.user.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/tech';
        }
      })
      .catch(err => {
        $('#loginErrorMsg').text(err.message || 'Invalid username or password');
        $err.removeClass('d-none');
      })
      .finally(() => {
        $btn.prop('disabled', false);
        $spinner.addClass('d-none');
      });
  });
});
</script>
</body>
</html>
